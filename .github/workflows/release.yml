name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish the runner image and the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run build

      # The image is part of the execution boundary, so a release publishes the
      # exact one the tag was tested with, and the release notes carry its digest:
      # a digest cannot be moved the way a tag can.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/fulkrum-runner"
          docker build --tag "$image:${GITHUB_REF_NAME}" --tag "$image:latest" server/runner
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:${GITHUB_REF_NAME}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed in this version.

          The execution boundary for this release is published at
          \`${{ steps.image.outputs.digest }}\` — pin \`FULKRUM_RUNNER_IMAGE\` to that
          digest to run exactly what was tested here."
